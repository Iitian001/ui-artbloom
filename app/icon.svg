<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ui.artbloom">
  <!--
    The mark: a four-petal bloom on the same near-black the dark theme uses.

    An SVG rather than a generated PNG, for three reasons. It is the one icon
    format that needs no font (`next/og` renders text with Satori, and there is
    no font file in this repository); `sizes="any"` means one file covers the
    tab, the bookmark bar and a search result; and the geometry stays legible at
    16px because the silhouette is four lobes rather than a letterform.

    `app/apple-icon.tsx` reads this exact file and rasterises it, so the home
    screen icon cannot drift from the tab icon.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a" />
  <g fill="#fafafa">
    <path d="M16 16C12.4 12.6 12.4 8.4 16 5.5C19.6 8.4 19.6 12.6 16 16Z" />
    <path d="M16 16C12.4 12.6 12.4 8.4 16 5.5C19.6 8.4 19.6 12.6 16 16Z" transform="rotate(90 16 16)" />
    <path d="M16 16C12.4 12.6 12.4 8.4 16 5.5C19.6 8.4 19.6 12.6 16 16Z" transform="rotate(180 16 16)" />
    <path d="M16 16C12.4 12.6 12.4 8.4 16 5.5C19.6 8.4 19.6 12.6 16 16Z" transform="rotate(270 16 16)" />
  </g>
  <circle cx="16" cy="16" r="2.1" fill="#0a0a0a" />
</svg>
